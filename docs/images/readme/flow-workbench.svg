  <text x="904" y="442" fill="#69778b" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="750">APPEARS AT</text>
  <rect x="904" y="460" width="232" height="38" rx="8" fill="#fff0f5" stroke="#e5b9c8"/>
  <text x="918" y="484" fill="#713a4f" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="650">Evidence chips + confidence</text>
  <text x="904" y="552" fill="#78869a" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12">flow 3 · schema 5</text>
