<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">User Flow Workbench</title>
  <desc id="desc">A compact product flow crosses a grid canvas beside variant tabs and a detail inspector.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#dfe6f0" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17233a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a99ad"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="28" fill="#f3f6fa"/>
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="#fbfcfe" stroke="#cbd5e1"/>

  <rect x="24" y="24" width="1152" height="64" rx="20" fill="#ffffff"/>
