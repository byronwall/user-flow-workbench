<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">03 / New overview, familiar shell</title><desc id="desc">The new board replaces the flow canvas. Keep the inspector and source tab positions.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#8995a1;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8995a1"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#bac1c9"/><rect x="0" y="0" width="934" height="44" rx="0" fill="#ffffff" stroke="#bac1c9"/><text x="12" y="20" font-size="14" font-weight="700" fill="#26303b">User Flow Workbench</text><text x="12" y="36" font-size="10" font-weight="400" fill="#65717f">resume-app.diagram</text><rect x="255" y="11" width="77" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="293.5" y="27" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Overview</text><rect x="605" y="7" width="112" height="30" rx="4" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><text x="661.0" y="27" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">Reload source</text><rect x="726" y="7" width="95" height="30" rx="4" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><text x="773.5" y="27" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">All diagrams</text><rect x="830" y="7" width="94" height="30" rx="4" fill="#ffffff" stroke="#bac1c9"/><text x="877.0" y="27" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">Export JSON</text><rect x="0" y="44" width="934" height="676" rx="0" fill="#f2f4f6" stroke="#bac1c9"/><text x="30" y="92" font-size="25" font-weight="700" fill="#26303b">Resume app</text><rect x="206" y="73" width="73" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="242.5" y="89" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Intended</text><text x="30" y="123" font-size="15" font-weight="400" fill="#65717f">Prepare a relevant resume using truthful career evidence.</text><rect x="20" y="151" width="893" height="405" rx="6" fill="none" stroke="#285da8" stroke-dasharray="6 4"/><text x="35" y="185" font-size="16" font-weight="700" fill="#26303b">Role &amp; evidence</text><path d="M35 201L301 201" fill="none" stroke="#9eabb7"/><rect x="35" y="222" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="245" font-size="14" font-weight="600" fill="#26303b">Understand job</text><text x="48" y="263" font-size="14" font-weight="600" fill="#26303b">requirements</text><rect x="35" y="292" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="324" font-size="14" font-weight="600" fill="#26303b">Inventory career evidence</text><rect x="35" y="362" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="394" font-size="14" font-weight="600" fill="#26303b">See matches and gaps</text><text x="328" y="185" font-size="16" font-weight="700" fill="#26303b">Drafting</text><path d="M328 201L594 201" fill="none" stroke="#9eabb7"/><rect x="328" y="222" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="341" y="254" font-size="14" font-weight="600" fill="#26303b">Tailor a resume to a role</text><rect x="328" y="292" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="341" y="324" font-size="14" font-weight="600" fill="#26303b">Prioritize useful changes</text><text x="621" y="185" font-size="16" font-weight="700" fill="#26303b">Review &amp; output</text><path d="M621 201L887 201" fill="none" stroke="#9eabb7"/><rect x="621" y="222" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="634" y="254" font-size="14" font-weight="600" fill="#26303b">Review suggested edits</text><rect x="621" y="292" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="634" y="324" font-size="14" font-weight="600" fill="#26303b">Approve a final resume</text><rect x="621" y="362" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="634" y="394" font-size="14" font-weight="600" fill="#26303b">Export the result</text><text x="31" y="594" font-size="12" font-weight="400" fill="#65717f">Grouped capabilities · no sequence implied</text><rect x="934" y="0" width="346" height="720" rx="0" fill="#ffffff" stroke="#bac1c9"/><text x="955" y="27" font-size="13" font-weight="600" fill="#285da8">Inspector</text><text x="1120" y="21" font-size="13" font-weight="600" fill="#26303b">Diagram DSL</text><text x="1120" y="37" font-size="10" font-weight="400" fill="#65717f">Read only</text><path d="M951 43L1080 43" fill="none" stroke="#285da8"/><text x="954" y="78" font-size="14" font-weight="700" fill="#26303b">About this overview</text><text x="954" y="116" font-size="22" font-weight="700" fill="#26303b">Resume app</text><rect x="954" y="134" width="73" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="990.5" y="150" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Intended</text><text x="954" y="196" font-size="14" font-weight="400" fill="#26303b">A working idea, ready to reduce</text><text x="954" y="219" font-size="14" font-weight="400" fill="#26303b">through conversation.</text><path d="M953 242L1260 242" fill="none" stroke="#bac1c9"/><text x="954" y="277" font-size="15" font-weight="600" fill="#26303b">Select a capability</text><text x="954" y="304" font-size="13" font-weight="400" fill="#65717f">Read its detail and open a related</text><text x="954" y="326" font-size="13" font-weight="400" fill="#65717f">flow when one exists.</text><path d="M953 627L1260 627" fill="none" stroke="#bac1c9"/><text x="954" y="656" font-size="12" font-weight="600" fill="#26303b">Source current</text><text x