<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">06 / A temporary alternative</title><desc id="desc">Use the existing view-tab pattern to show one complete idea at a time.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#8995a1;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8995a1"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#bac1c9"/><rect x="0" y="0" width="934" height="44" rx="0" fill="#ffffff" stroke="#bac1c9"/><text x="12" y="20" font-size="14" font-weight="700" fill="#26303b">User Flow Workbench</text><text x="12" y="36" font-size="10" font-weight="400" fill="#65717f">resume-app.diagram</text><rect x="255" y="11" width="77" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="293.5" y="27" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Overview</text><rect x="605" y="7" width="112" height="30" rx="4" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><text x="661.0" y="27" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">Reload source</text><rect x="726" y="7" width="95" height="30" rx="4" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><text x="773.5" y="27" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">All diagrams</text><rect x="830" y="7" width="94" height="30" rx="4" fill="#ffffff" stroke="#bac1c9"/><text x="877.0" y="27" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">Export JSON</text><rect x="0" y="44" width="934" height="42" rx="0" fill="#ffffff" stroke="#bac1c9"/><text x="10" y="70" font-size="12" font-weight="400" fill="#65717f">View</text><rect x="50" y="50" width="115" height="30" rx="4" fill="#ffffff" stroke="#bac1c9"/><text x="107.5" y="70" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">Current idea</text><rect x="176" y="50" width="159" height="30" rx="4" fill="#eef4fc" stroke="#285da8" stroke-dasharray="6 4"/><text x="255.5" y="70" font-size="12" font-weight="600" fill="#285da8" text-anchor="middle">Guided interview</text><rect x="0" y="86" width="934" height="634" rx="0" fill="#f2f4f6" stroke="#bac1c9"/><text x="30" y="134" font-size="25" font-weight="700" fill="#26303b">Resume app</text><rect x="206" y="115" width="73" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="242.5" y="131" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Intended</text><text x="30" y="165" font-size="15" font-weight="400" fill="#65717f">Prepare a relevant resume using truthful career evidence.</text><rect x="20" y="193" width="893" height="405" rx="6" fill="none" stroke="#285da8" stroke-dasharray="6 4"/><text x="35" y="227" font-size="16" font-weight="700" fill="#26303b">Role &amp; evidence</text><path d="M35 243L301 243" fill="none" stroke="#9eabb7"/><rect x="35" y="264" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="287" font-size="14" font-weight="600" fill="#26303b">Understand job</text><text x="48" y="305" font-size="14" font-weight="600" fill="#26303b">requirements</text><rect x="35" y="334" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="366" font-size="14" font-weight="600" fill="#26303b">Inventory career evidence</text><rect x="35" y="404" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="436" font-size="14" font-weight="600" fill="#26303b">See matches and gaps</text><rect x="35" y="474" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="48" y="506" font-size="14" font-weight="600" fill="#26303b">Answer evidence questions</text><text x="328" y="227" font-size="16" font-weight="700" fill="#26303b">Drafting</text><path d="M328 243L594 243" fill="none" stroke="#9eabb7"/><rect x="328" y="264" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="341" y="296" font-size="14" font-weight="600" fill="#26303b">Tailor a resume to a role</text><rect x="328" y="334" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="341" y="366" font-size="14" font-weight="600" fill="#26303b">Prioritize useful changes</text><text x="621" y="227" font-size="16" font-weight="700" fill="#26303b">Review &amp; output</text><path d="M621 243L887 243" fill="none" stroke="#9eabb7"/><rect x="621" y="264" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="634" y="296" font-size="14" font-weight="600" fill="#26303b">Review suggested edits</text><rect x="621" y="334" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="634" y="366" font-size="14" font-weight="600" fill="#26303b">Approve a final resume</text><rect x="621" y="404" width="265" height="54" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="634" y="436" font-size="14" font-weight="600" fill="#26303b">Export the result</text><text x="31" y="636" font-size="12" font-weight="400" fill="#65717f">Grouped capabilities · no sequence implied</text><rect x="934" y="0" width="346" height="720" rx="0" fill="#ffffff" stroke="#bac1c9"/><text x="955" y="27" font-size="13" font-weight="600" fill="#285da8">Inspector</text><text x="1120" y="21" font-size="13" font-weight="600" fill="#26303b">Diagram DSL</text><text x="1120" y="37" font-size="10" font-weight="400" fill="#65717f">Read only</text><path d="M951 43L1080 43" fill="none" stroke="#285da8"/><text x="954" y="78" font-size="14" font-weight="700" fill="#26303b">About this overview</text><text x="954" y="116" font-size="22" font-weight="700" fill="#26303b">Resume app</text><rect x="954" y="134" width="73" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="990.5" y="150" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Intended</text><text x="954" y="196" font-size="14" font-weight="400" fill="#26303b">A working idea, ready to reduce</text><text x="954" y="219" font-size="14" font-weight="400" fill="#26303b">through conversation.</text><path d="M953 242L1260 242" fill="none" stroke="#bac1c9"/><text x="954" y="277" font-size="15" font-weight="600" fill="#26303b">Select a capability</text><text x="954" y="304" font-size="13" font-weight="400" fill="#65717f">Read its detail and open a related</text><text x="954" y="326" font-size="13" font-weight="400" fill="#65717f">flow when one exists.</text><path d="M953 376L1260 376" fill="none" stroke="#bac1c9"/><text x="954" y="409" font-size="15" font-weight="700" fill="#26303b">Guided interview</text><text x="954" y="438" font-size="13" font-weight="400" fill="#26303b">Ask for missing evidence before</text><text x="954" y="460" font-size="13" font-weight="400" fill="#26303b">drafting targeted changes.</text><text x="954" y="502" font-size="12" font-weight="400" fill="#65717f">Switch views to compare.</text><path d="M953 627L1260 627" fill="none" stroke="#bac1c9"/><text x="954" y="656" font-size="12" font-weight="600" fill="#26303b">Source current</text><text x="954" y="681" font-size="12" font-weight="400" fill="#65717f">Edit through your agent.</text></svg>