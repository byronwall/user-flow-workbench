<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">07 / Local loading, empty, and stale states</title><desc id="desc">Four local states that reuse the shell and inspector rather than add screens.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#8995a1;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8995a1"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#bac1c9"/><text x="36" y="52" font-size="26" font-weight="700" fill="#26303b">Source and empty states</text><text x="36" y="82" font-size="15" font-weight="400" fill="#65717f">Local states inside the overview; no new workflow screens.</text><rect x="36" y="118" width="1208" height="108" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="58" y="154" font-size="17" font-weight="700" fill="#26303b">Loading diagram…</text><text x="58" y="188" font-size="14" font-weight="400" fill="#65717f">Keep the shell stable while the selected source loads.</text><rect x="36" y="255" width="1208" height="108" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="58" y="291" font-size="17" font-weight="700" fill="#26303b">No capabilities yet</text><text x="58" y="325" font-size="14" font-weight="400" fill="#65717f">Describe the idea to your agent, then reload the source.</text><rect x="36" y="392" width="1208" height="108" rx="5" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><text x="58" y="428" font-size="17" font-weight="700" fill="#26303b">Source error · Showing previous valid view</text><text x="58" y="462" font-size="14" font-weight="400" fill="#65717f">Line 8: unknown group. Keep the board visible; show Retry and the diagnostic.</text><rect x="1135" y="412" width="85" height="30" rx="4" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><text x="1177.5" y="432" font-size="12" font-weight="600" fill="#26303b" text-anchor="middle">Retry</text><rect x="36" y="529" width="1208" height="108" rx="5" fill="#ffffff" stroke="#bac1c9"/><text x="58" y="565" font-size="17" font-weight="700" fill="#26303b">This capability was removed</text><text x="58" y="599" font-size="14" font-weight="400" fill="#65717f">Clear selection; return the inspector to the overview summary.</text></svg>