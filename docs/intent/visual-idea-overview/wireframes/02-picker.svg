<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">02 / One picker for both types</title><desc id="desc">Adapt the existing file picker. Document kind is a label, not a new navigation hierarchy.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#8995a1;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8995a1"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#bac1c9"/><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f2f4f6" stroke="#bac1c9"/><rect x="245" y="110" width="790" height="510" rx="9" fill="#ffffff" stroke="#bac1c9"/><text x="280" y="156" font-size="15" font-weight="700" fill="#26303b">User Flow Workbench</text><text x="280" y="203" font-size="28" font-weight="700" fill="#26303b">Choose a diagram</text><text x="280" y="238" font-size="14" font-weight="400" fill="#65717f">Files in this folder and its subfolders</text><path d="M278 266L1000 266" fill="none" stroke="#bac1c9"/><rect x="276" y="284" width="728" height="78" rx="4" fill="#ffffff" stroke="#285da8" stroke-dasharray="6 4"/><rect x="295" y="309" width="83" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="336.5" y="325" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Overview</text><text x="401" y="314" font-size="16" font-weight="600" fill="#26303b">Resume app</text><text x="401" y="338" font-size="12" font-weight="400" fill="#65717f">ideas/resume-app.diagram</text><text x="974" y="330" font-size="21" font-weight="400" fill="#285da8">→</text><rect x="276" y="378" width="728" height="78" rx="4" fill="#ffffff" stroke="#bac1c9"/><rect x="295" y="403" width="83" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="336.5" y="419" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Flow</text><text x="401" y="408" font-size="16" font-weight="600" fill="#26303b">Tailor a resume to a job posting</text><text x="401" y="432" font-size="12" font-weight="400" fill="#65717f">flows/resume-alignment.diagram</text><text x="974" y="424" font-size="21" font-weight="400" fill="#285da8">→</text><rect x="276" y="472" width="728" height="78" rx="4" fill="#ffffff" stroke="#bac1c9"/><rect x="295" y="497" width="83" height="23" rx="3" fill="#eef4fc" stroke="#285da8"/><text x="336.5" y="513" font-size="11" font-weight="600" fill="#285da8" text-anchor="middle">Flow</text><text x="401" y="502" font-size="16" font-weight="600" fill="#26303b">Online checkout</text><text x="401" y="526" font-size="12" font-weight="400" fill="#65717f">examples/checkout.diagram</text><text x="974" y="518" font-size="21" font-weight="400" fill="#285da8">→</text><text x="280" y="594" font-size="13" font-weight="400" fill="#65717f">One extension. Type comes from file metadata.</text></svg>